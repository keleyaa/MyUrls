<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MyURL v2 请求流程</title>
  <desc id="desc">MyURL v2 从接收 HTTP(S) URL 开始，经过 URL、别名和风险策略，使用 Redis NX 原子占位与 90 天 TTL，最后返回 302 短链。</desc>

  <rect width="1200" height="430" rx="28" fill="#f4f7f9"/>
  <path d="M64 78H1136" stroke="#d7e1e8"/>
  <text x="64" y="52" fill="#18324d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">一条请求，完成一次原子占位。</text>
  <text x="1136" y="52" text-anchor="end" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">MYURL / REQUEST FLOW</text>

  <g id="stage-input" transform="translate(64 116)">
    <rect width="238" height="190" rx="14" fill="#ffffff" stroke="#cbd9e3"/>
    <text x="24" y="40" fill="#1769ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">01</text>
    <text x="24" y="88" fill="#18324d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="700">接收 URL</text>
    <text x="24" y="128" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">HTTP(S) ONLY</text>
    <path d="M24 158H184" stroke="#1769ff" stroke-width="2"/>
    <path d="m178 152 8 6-8 6" fill="none" stroke="#1769ff" stroke-width="2"/>
  </g>

  <path d="M302 211H330" stroke="#1769ff" stroke-width="2"/>
  <path d="m324 205 8 6-8 6" fill="none" stroke="#1769ff" stroke-width="2"/>

  <g id="stage-guard" transform="translate(334 116)">
    <rect width="238" height="190" rx="14" fill="#ffffff" stroke="#cbd9e3"/>
    <text x="24" y="40" fill="#1769ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">02</text>
    <text x="24" y="88" fill="#18324d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="700">校验与风险</text>
    <text x="24" y="128" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ALIAS POLICY</text>
    <circle cx="28" cy="163" r="4" fill="#e36f52"/>
    <text x="44" y="170" fill="#a06b2c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">TURNSTILE IF NEEDED</text>
  </g>

  <path d="M572 211H600" stroke="#1769ff" stroke-width="2"/>
  <path d="m594 205 8 6-8 6" fill="none" stroke="#1769ff" stroke-width="2"/>

  <g id="stage-claim" transform="translate(604 116)">
    <rect width="238" height="190" rx="14" fill="#ffffff" stroke="#cbd9e3"/>
    <text x="24" y="40" fill="#1769ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">03</text>
    <text x="24" y="88" fill="#18324d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="700">Redis 占位</text>
    <text x="24" y="128" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">SET NX EX</text>
    <text x="24" y="166" fill="#1b7c5b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">TTL 90 DAYS</text>
  </g>

  <path d="M842 211H870" stroke="#e36f52" stroke-width="2"/>
  <path d="m864 205 8 6-8 6" fill="none" stroke="#e36f52" stroke-width="2"/>

  <g id="stage-redirect" transform="translate(874 116)">
    <rect width="262" height="190" rx="14" fill="#fff8f5" stroke="#efc5b7"/>
    <text x="24" y="40" fill="#e36f52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">04</text>
    <text x="24" y="88" fill="#18324d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="700">返回短链</text>
    <text x="24" y="128" fill="#a06b2c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">302 /:CODE</text>
    <text x="24" y="166" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">GET + HEAD</text>
  </g>

  <path d="M64 342H1136" stroke="#d7e1e8"/>
  <text x="64" y="378" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">无账号</text>
  <circle cx="158" cy="372" r="3" fill="#1769ff"/>
  <text x="178" y="378" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">不抓取目标</text>
  <circle cx="326" cy="372" r="3" fill="#1769ff"/>
  <text x="346" y="378" fill="#60788e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">不迁移 v1 数据</text>
  <text x="1136" y="378" text-anchor="end" fill="#1b7c5b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">ATOMIC · EXPIRES</text>
</svg>
