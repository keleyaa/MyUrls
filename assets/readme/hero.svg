<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">myurl</title>
  <desc id="desc">一个自托管、匿名的短链工具：把长链接收成固定 90 天有效的清晰入口。</desc>

  <rect width="1200" height="360" fill="#ff6841"/>
  <path d="M0 282C202 230 333 335 556 279C755 229 930 184 1200 249V360H0Z" fill="#20211e"/>
  <path d="M0 313C206 261 388 350 601 294C785 245 980 217 1200 271" fill="none" stroke="#d9fb55" stroke-width="5"/>

  <g transform="translate(66 64)">
    <text x="0" y="0" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" letter-spacing="2">SELF-HOSTED SHORT LINKS</text>
    <text x="0" y="130" fill="#20211e" font-family="Arial Black, Arial, sans-serif" font-size="128" font-weight="900" letter-spacing="-9">myurl</text>
    <text x="6" y="179" fill="#20211e" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700">把长链接，收成一个清晰入口。</text>

    <g transform="translate(4 220)">
      <rect width="180" height="36" rx="18" fill="#20211e"/>
      <text x="18" y="24" fill="#fff4e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">ANONYMOUS</text>
      <rect x="193" width="154" height="36" rx="18" fill="#d9fb55"/>
      <text x="211" y="24" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">90 DAYS</text>
      <rect x="360" width="164" height="36" rx="18" fill="#fff4e9"/>
      <text x="378" y="24" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">NO TRACKING</text>
    </g>
  </g>

  <g transform="translate(792 79)">
    <rect width="338" height="182" rx="10" fill="#fff4e9" stroke="#20211e" stroke-width="3"/>
    <path d="M25 38H313" stroke="#20211e" stroke-width="3"/>
    <text x="26" y="27" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">LONG URL</text>
    <text x="26" y="75" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">example.com/docs/release</text>
    <path d="M26 99H312" stroke="#ff6841" stroke-width="4"/>
    <text x="26" y="127" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">CLEAR ENTRY / 90 DAYS</text>
    <text x="26" y="162" fill="#20211e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">myurl.example/docs</text>
  </g>

  <circle cx="1128" cy="57" r="12" fill="#d9fb55"/>
  <circle cx="1158" cy="57" r="12" fill="#20211e"/>
</svg>
