<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">MyURL v2</title>
  <desc id="desc">一个自托管的短链服务：将 HTTP(S) URL 转为 90 天有效的短入口。</desc>

  <rect width="1200" height="320" rx="20" fill="#f7f6f2"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#deddd7" stroke-width="2"/>

  <g id="title-block" transform="translate(64 62)">
    <text x="0" y="0" fill="#65706c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">自托管短链服务</text>
    <text x="0" y="82" fill="#171b19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="72" font-weight="700">MyURL v2</text>
    <text x="0" y="126" fill="#414a46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26">为 HTTP(S) 链接生成 90 天有效的短入口。</text>
    <path d="M0 168H520" stroke="#c9cec8" stroke-width="2"/>
    <text x="0" y="205" fill="#65706c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">匿名 · 无统计 · 结果自动复制</text>
  </g>

  <g id="url-specimen" transform="translate(734 56)">
    <path d="M0 0V208" stroke="#c9cec8" stroke-width="2"/>
    <text x="34" y="12" fill="#65706c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">HTTP(S) URL</text>
    <text x="34" y="52" fill="#252d2a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">example.com/docs/release</text>
    <path d="M34 82H402" stroke="#c9cec8" stroke-width="2"/>
    <path d="m394 76 10 6-10 6" fill="none" stroke="#0b8f68" stroke-width="2"/>
    <text x="34" y="122" fill="#65706c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">短路径 / 90 天有效</text>
    <text x="34" y="166" fill="#0b8f68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">myurl.example/q7R3mK9xTa</text>
    <text x="34" y="204" fill="#65706c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">302 跳转 · Redis TTL</text>
  </g>
</svg>
