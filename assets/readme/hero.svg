<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MyUrls URL shortening flow</title>
  <desc id="desc">A target URL becomes a short key and redirects with HTTP 301.</desc>
  <style>
    .bg{fill:#f4f7ff}.surface{fill:#fff;stroke:#dce5ff;stroke-width:2}.ink{fill:#12192a}.muted{fill:#657087}.blue{fill:#1769ff}.line{stroke:#b9cbff;stroke-width:3;fill:none}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px}.title{font:800 68px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.code{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace}.tiny{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px}@media (prefers-color-scheme:dark){.bg{fill:#080b14}.surface{fill:#121829;stroke:#283753}.ink{fill:#f2f5ff}.muted{fill:#abb6d1}.blue{fill:#6f9fff}.line{stroke:#668bdf}}
  </style>
  <rect class="bg" width="1200" height="520" rx="32"/>
  <circle cx="1070" cy="78" r="210" fill="#1769ff" opacity=".09"/>
  <circle cx="640" cy="520" r="250" fill="#1769ff" opacity=".05"/>
  <text x="76" y="104" class="label blue">GO · GIN · REDIS</text>
  <text x="76" y="183" class="title ink">MyUrls</text>
  <text x="76" y="226" class="body muted">把可信目标网址变成简洁、可运营的短链接。</text>
  <rect x="76" y="282" width="445" height="82" rx="20" class="surface"/>
  <circle cx="113" cy="323" r="13" class="blue"/>
  <text x="142" y="330" class="code muted">https://example.com/guide</text>
  <path d="M532 323h76" class="line"/>
  <path d="m596 311 16 12-16 12" class="line"/>
  <rect x="626" y="282" width="166" height="82" rx="20" class="blue"/>
  <text x="659" y="332" class="code" fill="#fff">aZ4xPq7</text>
  <path d="M804 323h76" class="line"/>
  <path d="m868 311 16 12-16 12" class="line"/>
  <rect x="899" y="282" width="205" height="82" rx="20" class="surface"/>
  <text x="929" y="315" class="tiny muted">REDIRECT</text>
  <text x="929" y="343" class="code blue">HTTP 301</text>
  <rect x="76" y="416" width="1028" height="1" fill="#cbd7f7" opacity=".7"/>
  <text x="76" y="461" class="tiny muted">CASE-SENSITIVE KEY</text>
  <text x="359" y="461" class="tiny muted">365-DAY TTL</text>
  <text x="615" y="461" class="tiny muted">ATOMIC CLAIM</text>
  <text x="900" y="461" class="tiny muted">REDIS-BACKED</text>
</svg>
