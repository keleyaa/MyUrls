<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">MyUrls request path</title>
  <desc id="desc">A request passes from Gin to App, Store, and Redis, then returns through the compatibility response layer.</desc>
  <style>
    .bg{fill:#f4f7ff}.card{fill:#fff;stroke:#dce5ff;stroke-width:2}.ink{fill:#12192a}.muted{fill:#657087}.blue{fill:#1769ff}.soft{fill:#e8f0ff}.line{stroke:#9bb7ff;stroke-width:3;fill:none}.heading{font:800 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}@media (prefers-color-scheme:dark){.bg{fill:#080b14}.card{fill:#121829;stroke:#283753}.ink{fill:#f2f5ff}.muted{fill:#abb6d1}.blue{fill:#6f9fff}.soft{fill:#18284a}.line{stroke:#668bdf}}
  </style>
  <rect class="bg" width="1200" height="330" rx="28"/>
  <text x="70" y="63" class="heading ink">最小请求路径</text>
  <text x="70" y="93" class="small muted">HTTP 适配、业务规则与 Redis 操作各自只承担一件事。</text>
  <g transform="translate(70 145)">
    <rect width="190" height="102" rx="18" class="card"/><text x="28" y="43" class="body ink">Gin</text><text x="28" y="72" class="small muted">bind · auth · limit</text>
    <path d="M205 51h75" class="line"/><path d="m268 39 16 12-16 12" class="line"/>
    <rect x="300" width="190" height="102" rx="18" class="card"/><text x="328" y="43" class="body ink">App</text><text x="328" y="72" class="small muted">validate · create</text>
    <path d="M505 51h75" class="line"/><path d="m568 39 16 12-16 12" class="line"/>
    <rect x="600" width="190" height="102" rx="18" class="card"/><text x="628" y="43" class="body ink">Store</text><text x="628" y="72" class="small muted">claim · lookup</text>
    <path d="M805 51h75" class="line"/><path d="m868 39 16 12-16 12" class="line"/>
    <rect x="900" width="190" height="102" rx="18" class="soft"/><text x="928" y="43" class="body blue">Redis</text><text x="928" y="72" class="small muted">string · TTL · SetNX</text>
  </g>
</svg>
