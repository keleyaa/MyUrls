name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust, web, Redis, Compose, browser, and security verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust
        run: >-
          rustup toolchain install 1.88.0 --profile minimal
          --component rustfmt
          --component clippy
          && rustup default 1.88.0

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit
        run: corepack pnpm exec playwright install --with-deps chromium webkit

      - name: Run Rust and web verification gate
        run: corepack pnpm verify
