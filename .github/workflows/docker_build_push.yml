name: Publish GHCR image

on:
  push:
    tags:
      # Release tags intentionally use a flat version namespace; '/' is unsupported.
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Run full CI verification
    permissions:
      contents: read
    uses: ./.github/workflows/go.yml

  publish:
    name: Build and publish multi-platform image
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare safe image version tag
        id: image_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${EVENT_NAME}" == 'push' ]]; then
            candidate="${REF_NAME}"
          else
            candidate="manual-${RUN_NUMBER}"
          fi

          oci_tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [[ "${candidate}" =~ ${oci_tag_pattern} ]]; then
            version_tag="${candidate}"
          else
            digest="$(printf '%s' "${candidate}" | sha256sum | cut -c1-12)"
            safe_prefix="$(printf '%s' "${candidate}" | LC_ALL=C sed -E 's/[^A-Za-z0-9_.-]+/-/g')"
            if [[ ! "${safe_prefix}" =~ ^[A-Za-z0-9_] ]]; then
              safe_prefix="v-${safe_prefix}"
            fi

            suffix="-${digest}"
            prefix_limit=$((128 - ${#suffix}))
            safe_prefix="${safe_prefix:0:${prefix_limit}}"
            version_tag="${safe_prefix}${suffix}"
          fi

          if [[ ! "${version_tag}" =~ ${oci_tag_pattern} ]]; then
            echo 'Failed to produce a valid OCI image tag.' >&2
            exit 1
          fi
          printf 'version_tag=%s\n' "${version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm64,linux/ppc64le,linux/arm/v7
          push: true
          tags: |
            ghcr.io/keleyaa/myurls:${{ steps.image_tag.outputs.version_tag }}
            ghcr.io/keleyaa/myurls:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION_TAG: ${{ steps.image_tag.outputs.version_tag }}
        run: |
          printf '### GHCR image published\n\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Image: `ghcr.io/keleyaa/myurls`\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Version tag: `%s`\n' "${VERSION_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Commit tag: `%s`\n' "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
