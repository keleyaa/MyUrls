name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-platform image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare safe image version tag
        id: image_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${EVENT_NAME}" == 'push' ]]; then
            version_tag="${REF_NAME}"
          else
            version_tag="manual-${RUN_NUMBER}"
          fi
          printf 'version_tag=%s\n' "${version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm64,linux/ppc64le,linux/arm/v7
          push: true
          tags: |
            ghcr.io/keleyaa/myurls:${{ steps.image_tag.outputs.version_tag }}
            ghcr.io/keleyaa/myurls:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION_TAG: ${{ steps.image_tag.outputs.version_tag }}
        run: |
          printf '### GHCR image published\n\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Image: `ghcr.io/keleyaa/myurls`\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Version tag: `%s`\n' "${VERSION_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Commit tag: `%s`\n' "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
