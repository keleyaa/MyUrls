name: Publish GHCR image

on:
  push:
    tags:
      # Release tags intentionally use a flat version namespace; '/' is unsupported.
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-release
  cancel-in-progress: false

jobs:
  verification:
    name: Run full CI verification
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish multi-platform image
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/master; then
            echo 'Release commits must be reachable from master.' >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image_tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCED: ${{ github.event.forced }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "${EVENT_NAME}" == 'push' ]]; then
            candidate="${REF_NAME}"
          else
            candidate="${VERSION_INPUT}"
          fi

          if [[ "${EVENT_NAME}" == 'push' && "${FORCED}" == 'true' ]]; then
            echo 'Forced tag updates are not valid release events.' >&2
            exit 1
          fi

          stable_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${candidate}" =~ ${stable_tag_pattern} ]]; then
            echo 'Releases must use a stable version like v2.0.0.' >&2
            exit 1
          fi

          oci_tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [[ "${candidate}" =~ ${oci_tag_pattern} ]]; then
            version_tag="${candidate}"
          else
            digest="$(printf '%s' "${candidate}" | sha256sum | cut -c1-12)"
            safe_prefix="$(printf '%s' "${candidate}" | LC_ALL=C sed -E 's/[^A-Za-z0-9_.-]+/-/g')"
            if [[ ! "${safe_prefix}" =~ ^[A-Za-z0-9_] ]]; then
              safe_prefix="v-${safe_prefix}"
            fi

            suffix="-${digest}"
            prefix_limit=$((128 - ${#suffix}))
            safe_prefix="${safe_prefix:0:${prefix_limit}}"
            version_tag="${safe_prefix}${suffix}"
          fi

          if [[ ! "${version_tag}" =~ ${oci_tag_pattern} ]]; then
            echo 'Failed to produce a valid OCI image tag.' >&2
            exit 1
          fi
          tags="ghcr.io/keleyaa/myurls:${version_tag}"
          tags="${tags}"$'\n'"ghcr.io/keleyaa/myurls:${GITHUB_SHA}"
          publish_latest=false
          if [[ "${candidate}" =~ ${stable_tag_pattern} ]]; then
            tags="${tags}"$'\n'"ghcr.io/keleyaa/myurls:latest"
            publish_latest=true
          fi

          {
            printf 'release_tag=%s\n' "${candidate}"
            printf 'version_tag=%s\n' "${version_tag}"
            printf 'publish_latest=%s\n' "${publish_latest}"
            printf 'tags<<EOF\n'
            printf '%s\n' "${tags}"
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure Git tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.image_tags.outputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null
          tag_status=$?
          set -e
          if [[ "${tag_status}" -eq 0 ]]; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
            existing_sha="$(git rev-parse FETCH_HEAD^{commit})"
            if [[ "${existing_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Git tag ${RELEASE_TAG} already points to ${existing_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
            echo "Git tag ${RELEASE_TAG} already points to this commit; continuing."
          elif [[ "${tag_status}" -eq 2 ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "${RELEASE_TAG}" "${RELEASE_SHA}" --message "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          else
            echo "Unable to check whether Git tag ${RELEASE_TAG} exists." >&2
            exit "${tag_status}"
          fi

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.image_tags.outputs.release_tag }}
          VERSION_TAG: ${{ steps.image_tags.outputs.version_tag }}
          PUBLISH_LATEST: ${{ steps.image_tags.outputs.publish_latest }}
        run: |
          printf '### GHCR image published\n\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Image: `ghcr.io/keleyaa/myurls`\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Version tag: `%s`\n' "${VERSION_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Commit tag: `%s`\n' "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            printf -- '- Git tag: `%s` created for this commit\n' "${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf -- '- Git tag: `%s` triggered this release\n' "${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ "${PUBLISH_LATEST}" == true ]]; then
            printf -- '- Stable tag: `latest` moved to this digest\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf -- '- Stable tag: `latest` unchanged\n' >> "${GITHUB_STEP_SUMMARY}"
          fi
          printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
