<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyUrls</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="tool-card" aria-labelledby="page-title">
      <a
        id="repo-logo"
        class="repo-logo"
        href="https://github.com/keleyaa/MyUrls"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="打开 MyUrls GitHub 仓库"
      >
        <img src="/logo.png" width="300" height="90" alt="MyUrls">
      </a>

      <h1 id="page-title">创建短链接</h1>
      <p class="intro">输入一个 HTTP 或 HTTPS 链接，可选择自定义短码。</p>

      <form id="shorten-form" action="/short" method="post">
        <div class="field">
          <label for="long-url">长链接</label>
          <input
            id="long-url"
            name="longUrl"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.com/path"
            required
          >
        </div>

        <div class="field">
          <label for="short-key">自定义短码 <span>（可选）</span></label>
          <input
            id="short-key"
            name="shortKey"
            type="text"
            inputmode="text"
            autocomplete="off"
            maxlength="64"
            pattern="[A-Za-z0-9_\-]{1,64}"
            placeholder="例如 docs_2026"
          >
        </div>

        <button id="shorten-button" class="primary-button" type="submit">生成短链接</button>

        <div class="field result-field">
          <label for="short-url">短链接</label>
          <div class="result-row">
            <input id="short-url" type="url" readonly aria-describedby="status">
            <button id="copy-button" class="secondary-button" type="button" disabled>复制</button>
          </div>
        </div>

        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
