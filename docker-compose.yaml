services:
  myurls:
    build: .
    restart: unless-stopped
    environment:
      MYURLS_PORT: ${MYURLS_PORT:-8080}
      MYURLS_DOMAIN: ${MYURLS_DOMAIN:-example.com}
      MYURLS_PROTO: ${MYURLS_PROTO:-https}
      MYURLS_REDIS_CONN: ${MYURLS_REDIS_CONN:-myurls-redis:6379}
      MYURLS_REDIS_PASSWORD: ${MYURLS_REDIS_PASSWORD:-}
      MYURLS_API_TOKEN: ${MYURLS_API_TOKEN:-}
      MYURLS_RATE_LIMIT_RPS: ${MYURLS_RATE_LIMIT_RPS:-5}
      MYURLS_RATE_LIMIT_BURST: ${MYURLS_RATE_LIMIT_BURST:-10}
      MYURLS_MAX_BODY_BYTES: ${MYURLS_MAX_BODY_BYTES:-16384}
      MYURLS_READ_HEADER_TIMEOUT: ${MYURLS_READ_HEADER_TIMEOUT:-5s}
      MYURLS_READ_TIMEOUT: ${MYURLS_READ_TIMEOUT:-10s}
      MYURLS_WRITE_TIMEOUT: ${MYURLS_WRITE_TIMEOUT:-10s}
      MYURLS_IDLE_TIMEOUT: ${MYURLS_IDLE_TIMEOUT:-60s}
      MYURLS_SHUTDOWN_TIMEOUT: ${MYURLS_SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "${MYURLS_PORT:-8080}:${MYURLS_PORT:-8080}"
    volumes:
      - myurls-logs:/app/logs
    depends_on:
      myurls-redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: ${MYURLS_STOP_GRACE_PERIOD:-20s}

  myurls-redis:
    image: redis:8.10.0@sha256:c29e49ab2f85760a3827b53882e6dd9f5c6c3f0bb7d724e07bb31cbf275a5236
    restart: unless-stopped
    environment:
      MYURLS_REDIS_PASSWORD: ${MYURLS_REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$MYURLS_REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$MYURLS_REDIS_PASSWORD"
        fi
        exec redis-server
    volumes:
      - "${MYURLS_REDIS_DATA_PATH:-./data/redis}:/data"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$MYURLS_REDIS_PASSWORD" ]; then
            REDISCLI_AUTH="$$MYURLS_REDIS_PASSWORD" redis-cli ping;
          else
            redis-cli ping;
          fi | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  myurls-logs:
