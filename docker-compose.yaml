x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    image: myurl-v2-app:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_PORT: '3000'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      TURNSTILE_MODE: ${TURNSTILE_MODE:-cloudflare}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-}
      CREATE_DIRECT_LIMIT_10M: ${CREATE_DIRECT_LIMIT_10M:-5}
      CREATE_HARD_LIMIT_10M: ${CREATE_HARD_LIMIT_10M:-20}
      CREATE_HARD_LIMIT_1D: ${CREATE_HARD_LIMIT_1D:-100}
      RISK_CHALLENGE_SCORE: ${RISK_CHALLENGE_SCORE:-3}
      RISK_BLOCK_SCORE: ${RISK_BLOCK_SCORE:-8}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-750}
      TURNSTILE_TIMEOUT_MS: ${TURNSTILE_TIMEOUT_MS:-2500}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: node
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  redis:
    image: redis:8.10.0@sha256:c29e49ab2f85760a3827b53882e6dd9f5c6c3f0bb7d724e07bb31cbf275a5236
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        redis_args="--appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000"
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server $$redis_args --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server $$redis_args
    volumes:
      - myurl-v2-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping;
          else
            redis-cli ping;
          fi | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

volumes:
  myurl-v2-redis-data:
